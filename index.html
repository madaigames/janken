<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>忍者の里の じゃんけん勝負</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap');
:root{--ink:#49674e;--pink:#f4a9c5;--berry:#bd6f9e;--lav:#d8c5ef;--mint:#b8e3d2;--cream:#fffaf1;--gold:#edc96f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:'Kiwi Maru','Yu Gothic',sans-serif;background:radial-gradient(ellipse at 12% 14%,#fff 0 2px,transparent 3px),radial-gradient(ellipse at 85% 23%,#fff8cd 0 2px,transparent 3px),linear-gradient(180deg,#c7e8d6 0%,#e4f1d8 48%,#b8d6a7 100%);background-size:80px 80px,110px 110px,auto;display:grid;place-items:center;padding:28px 16px;overflow-x:hidden;position:relative}
body:before{content:'🌲　🌿　🌳　🌱　🌲　🌿　🌳　🌱　🌲　🌿　🌳　🌱';position:fixed;left:0;right:0;bottom:0;height:68px;background:linear-gradient(0deg,#759c68,#91b783);color:#456b49;text-align:center;font-size:33px;letter-spacing:8px;padding-top:8px;white-space:nowrap;overflow:hidden;opacity:.86}
.scene{width:min(820px,100%);position:relative;z-index:1}.moon{position:absolute;right:7%;top:-32px;width:68px;height:68px;border-radius:50%;background:#fff4c9;box-shadow:0 0 34px #fff7cf;opacity:.9}.card{position:relative;background:rgba(255,250,241,.95);border:3px solid #fff;border-radius:32px;box-shadow:0 14px 0 #aec9a5,0 25px 55px #416d4533;padding:clamp(22px,5vw,42px);text-align:center}.card:before,.card:after{content:'✦';position:absolute;color:#edc96f;font-size:25px}.card:before{top:20px;left:24px}.card:after{right:24px;bottom:18px}.eyebrow{font-size:13px;letter-spacing:.18em;color:#6b9470;margin:0 0 5px}h1{font-size:clamp(25px,5vw,40px);line-height:1.4;margin:0;color:#638e67;text-shadow:0 2px #fff}h1 span{color:#b77a54}.subtitle{margin:8px 0 23px;color:#7c9275;font-size:14px}.scoreboard{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 auto 22px}.score{background:white;border:2px solid #d8e8d3;border-radius:18px;padding:9px 22px;min-width:112px;box-shadow:0 4px #e1ecda}.score small{display:block;color:#829a7c;font-size:12px}.score strong{font-size:27px;color:#6d986c}.versus{font-size:14px;color:#87aa78}.arena{background:linear-gradient(110deg,#f1f8e9,#eef6e8);border:2px dashed #b7d2aa;border-radius:24px;padding:22px 16px 18px}.status{font-size:16px;min-height:29px;margin:0 0 16px;color:#617e5e}.players{display:grid;grid-template-columns:1fr 1fr;gap:14px}.player{background:#fffdf9;border:2px solid #e0ebd9;border-radius:20px;padding:16px 10px 14px;transition:.2s}.player.active{border-color:#9fc393;box-shadow:0 0 0 4px #e1f0dc}.player h2{font-size:16px;margin:0 0 12px}.player:first-child h2{color:#b77a78}.player:last-child h2{color:#777eb0}.choices{display:flex;justify-content:center;gap:8px}.choice{font:inherit;font-size:27px;line-height:1;background:#fff;border:2px solid #e1ead9;border-radius:15px;width:60px;height:60px;cursor:pointer;box-shadow:0 4px #dce8d7;transition:transform .12s,background .12s}.choice:hover{transform:translateY(-3px) rotate(-4deg);background:#f4faec}.choice:active{transform:translateY(2px);box-shadow:0 1px #dce8d7}.choice:focus-visible,button:focus-visible{outline:3px solid #88aa80;outline-offset:3px}.hand{font-size:52px;height:62px;margin:8px 0 0;line-height:1}.player-label{color:#8da187;font-size:11px;margin:0}.result{font-size:23px;font-weight:500;color:#688f65;min-height:34px;margin:17px 0 2px}.hint{font-size:12px;color:#82977a;min-height:20px;margin:0}.actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}.action{font:inherit;font-size:14px;color:#fff;background:linear-gradient(135deg,#8ebc83,#75a878);border:0;border-radius:999px;padding:11px 22px;cursor:pointer;box-shadow:0 4px #618a65}.action:hover{filter:brightness(1.04);transform:translateY(-1px)}.action.secondary{background:#fff;color:#708b6c;border:1px solid #d7e5d1;box-shadow:0 3px #dce8d7}.footer{font-size:11px;color:#8ca181;margin:17px 0 0}.sparkle{position:absolute;font-size:24px;animation:float 3s ease-in-out infinite}.s1{left:-19px;top:28%}.s2{right:-15px;bottom:27%;animation-delay:1s}@keyframes float{50%{transform:translateY(-9px) rotate(12deg)}}
.modebar{display:flex;justify-content:center;gap:9px;margin:-7px 0 18px;flex-wrap:wrap}.modebtn{font:inherit;font-size:13px;border:1px solid #cbdcc2;border-radius:999px;padding:9px 17px;background:#fff;color:#6e8a67;cursor:pointer}.modebtn.selected{background:#83ad79;color:#fff;border-color:#83ad79;box-shadow:0 3px #628b64}.roombox{display:none;background:#fffdf5;border:1px solid #d9e8ce;border-radius:18px;padding:14px;margin:0 0 18px}.roombox.show{display:block}.roombox p{font-size:12px;margin:3px;color:#788f70}.roombox .roomcode{font-size:24px;letter-spacing:.16em;color:#62885d;font-weight:500}.roombox input{font:inherit;width:130px;text-transform:uppercase;text-align:center;border:1px solid #cbdcc2;border-radius:10px;padding:8px;color:#49674e}.roombox button{font:inherit;border:0;border-radius:999px;background:#83ad79;color:white;padding:8px 14px;margin:5px;cursor:pointer}
body.japan{--ink:#5b4038;background:radial-gradient(ellipse at 12% 14%,#fff8eb 0 2px,transparent 3px),linear-gradient(180deg,#f5d9c6 0%,#f1e5c7 50%,#c7d4ae 100%)}body.japan:before{content:'🎋　🌸　⛩️　🌸　🎋　🍁　🎋　🌸　⛩️';background:linear-gradient(0deg,#8d5947,#bd8060);color:#fff0dd}.japan .card{box-shadow:0 14px 0 #c49b78,0 25px 55px #754c3833}.japan .eyebrow,.japan .subtitle,.japan .footer{color:#987257}.japan h1{color:#9f5147}.japan h1 span,.japan .result{color:#bf594b}.japan .arena{background:linear-gradient(110deg,#fff5e8,#f8eee2);border-color:#d8bba0}.japan .player,.japan .score{border-color:#ead3bb}.japan .player.active{border-color:#d58c74;box-shadow:0 0 0 4px #f6e0cf}.japan .score strong{color:#b8584c}.japan .action{background:linear-gradient(135deg,#c76d58,#a8453d);box-shadow:0 4px #873c36}.japan .action.secondary{background:#fff;color:#985950;border-color:#e5c9b6;box-shadow:0 3px #e6d0bd}.japan .modebtn{border-color:#e0c4ac;color:#9b6556}.japan .modebtn.selected{background:#b95e4e;color:white;border-color:#b95e4e;box-shadow:0 3px #91443d}.japan .roombox{border-color:#e2c3a8;background:#fff8ed}.japan .roombox p{color:#956e58}.japan .roombox .roomcode{color:#a54e43}.japan .roombox button{background:#b95e4e}.japan .roombox input{border-color:#e0c4ac;color:#5b4038}
@media(max-width:480px){.card{padding:24px 15px}.choices{gap:5px}.choice{width:52px;height:54px;font-size:24px}.player{padding:14px 6px}.score{min-width:90px;padding:8px 14px}.moon{right:4%;top:-23px;width:46px;height:46px}}
</style>
</head>
<body class="japan">
<main class="scene">
  <div class="moon" aria-hidden="true"></div><span class="sparkle s1" aria-hidden="true">✧</span><span class="sparkle s2" aria-hidden="true">✧</span>
  <section class="card" aria-label="2人対戦じゃんけんゲーム">
    <p class="eyebrow" id="eyebrow">⛩️ 忍者の里へ ようこそ ⛩️</p>
    <h1 id="title">竹林の道場で<br><span>じゃんけん</span>勝負！</h1>
    <p class="subtitle" id="subtitle">忍者と真剣勝負！ いざ、じゃん・けん・ぽん！</p>
    <nav class="modebar" aria-label="あそびかた"><button class="modebtn selected" data-mode="npc">🥷 忍者と対戦</button><button class="modebtn" data-mode="local">👭 ふたりで対戦</button><button class="modebtn" data-mode="room">⛩️ 部屋コードで招待</button></nav>
    <section class="roombox" id="roombox"><p>部屋を作って、招待コードをおともだちに送ろう</p><div class="roomcode" id="roomcode">------</div><button id="makeRoom">部屋を作る</button><button id="shareRoom">招待リンクをコピー</button><p id="roommessage">部屋を作ると招待コードが発行されます。参加する人はコードを入力してね。</p><div><input id="joinCode" maxlength="64" placeholder="招待コード" aria-label="招待コード"><button id="joinRoom">部屋に参加</button></div></section>
    <div class="scoreboard" aria-label="スコア">
      <div class="score"><small>🥷 プレイヤー 1</small><strong id="score1">0</strong></div><span class="versus">⚔️ VS ⚔️</span>
      <div class="score"><small id="score2label">🥷 忍者</small><strong id="score2">0</strong></div>
    </div>
    <div class="arena">
      <p class="status" id="status" aria-live="polite">プレイヤー 1 の ばんです♪</p>
      <div class="players">
        <section class="player active" id="player1">
          <h2>🥷 プレイヤー 1</h2><div class="choices" aria-label="プレイヤー1の手">
            <button class="choice" data-hand="rock" aria-label="グー">✊</button><button class="choice" data-hand="scissors" aria-label="チョキ">✌️</button><button class="choice" data-hand="paper" aria-label="パー">🖐️</button>
          </div><div class="hand" id="hand1" aria-label="選んだ手">？</div><p class="player-label">あなたの て</p>
        </section>
        <section class="player" id="player2">
          <h2>🥷 プレイヤー 2</h2><div class="choices" aria-label="プレイヤー2の手">
            <button class="choice" data-hand="rock" aria-label="グー">✊</button><button class="choice" data-hand="scissors" aria-label="チョキ">✌️</button><button class="choice" data-hand="paper" aria-label="パー">🖐️</button>
          </div><div class="hand" id="hand2" aria-label="選んだ手">？</div><p class="player-label">あなたの て</p>
        </section>
      </div>
      <p class="result" id="result"></p><p class="hint" id="hint">じぶんの てを えらんでね</p>
    </div>
    <div class="actions"><button class="action" id="next" hidden>もういっかい あそぶ ✨</button><button class="action secondary" id="reset">スコアをリセット</button><button class="action secondary" id="music" aria-pressed="false">♫ BGMをながす</button></div>
    <p class="footer" id="footer">🎋 竹林の道場で 何度でも勝負！ 🎋</p>
  </section>
</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  const icons={rock:'✊',scissors:'✌️',paper:'🖐️'};
  const names={rock:'グー',scissors:'チョキ',paper:'パー'};
  let turn=1, picks=[null,null], scores=[0,0], mode='npc';
  let peer=null, connection=null, roomRole=null, currentRoom='';
  const status=document.querySelector('#status'), result=document.querySelector('#result'), hint=document.querySelector('#hint');
  const next=document.querySelector('#next'), players=[document.querySelector('#player1'),document.querySelector('#player2')];
  function choose(hand){
    if(turn>2)return;
    picks[turn-1]=hand; document.querySelector(`#hand${turn}`).textContent=icons[hand];
    players[turn-1].classList.remove('active');
    if(turn===1&&mode==='npc'){
      picks[1]=['rock','scissors','paper'][Math.floor(Math.random()*3)];document.querySelector('#hand2').textContent=icons[picks[1]];turn=3;resolve();return;
    }
    if(turn===1){turn=2;players[1].classList.add('active');status.textContent='プレイヤー 2 の ばんです♪';hint.textContent='つぎのひとも てを えらんでね';}
    else{turn=3;resolve();}
  }
  function showOnlineResult(data){
    picks=data.picks; scores=data.scores;document.querySelector('#score1').textContent=scores[0];document.querySelector('#score2').textContent=scores[1];
    document.querySelector('#hand1').textContent=icons[picks[0]];document.querySelector('#hand2').textContent=icons[picks[1]];
    const a=picks[0],b=picks[1];result.textContent=a===b?'あいこ！もういっかい♪':data.winner===0?'プレイヤー 1 の かち！🎉':'プレイヤー 2 の かち！🎉';
    hint.textContent=`P1 ${names[a]}　・　P2 ${names[b]}`;status.textContent='じゃん・けん・ぽん！';next.hidden=false;
    document.querySelectorAll('.choice').forEach(button=>button.disabled=true);
  }
  function wireRoomConnection(conn){
    connection=conn;
    conn.on('open',()=>{
      mode='room';document.querySelector('#player2 h2').textContent='🥷 おともだち';document.querySelector('#score2label').textContent='🥷 おともだち';document.querySelector('#player2 .choices').hidden=false;
      if(roomRole==='guest'){players[0].querySelectorAll('.choice').forEach(b=>b.disabled=true);players[1].querySelectorAll('.choice').forEach(b=>b.disabled=false);players[0].classList.remove('active');players[1].classList.add('active');status.textContent='つながったよ！あなたの手をえらんでね';}
      else{players[0].querySelectorAll('.choice').forEach(b=>b.disabled=false);players[1].querySelectorAll('.choice').forEach(b=>b.disabled=true);status.textContent='おともだちが参加したよ！あなたの手をえらんでね';}
      document.querySelector('#roommessage').textContent='オンライン対戦中です。相手の手が届くまで待ってね♪';
    });
    conn.on('data',data=>{
      if(data.type==='pick'&&roomRole==='host'){picks[1]=data.hand;document.querySelector('#hand2').textContent=icons[data.hand];turn=3;resolve();const firstWins=(picks[0]==='rock'&&picks[1]==='scissors')||(picks[0]==='scissors'&&picks[1]==='paper')||(picks[0]==='paper'&&picks[1]==='rock');conn.send({type:'result',picks,scores,winner:picks[0]===picks[1]?-1:firstWins?0:1});}
      if(data.type==='result'&&roomRole==='guest')showOnlineResult(data);
      if(data.type==='next')resetRound(false);
    });
    conn.on('close',()=>{connection=null;status.textContent='接続がきれました。部屋コードで入りなおしてね。';document.querySelector('#roommessage').textContent='相手との接続が終了しました。';});
    conn.on('error',()=>{document.querySelector('#roommessage').textContent='接続に失敗しました。コードを確認して、もう一度ためしてね。';});
  }
  function resetRound(send=true){turn=roomRole==='guest'?2:1;picks=[null,null];players.forEach((p,i)=>{p.classList.toggle('active',roomRole==='guest'?i===1:i===0);p.querySelectorAll('.choice').forEach(b=>b.disabled=mode==='room'&&((roomRole==='guest'&&i===0)||(roomRole==='host'&&i===1)));});document.querySelector('#hand1').textContent='？';document.querySelector('#hand2').textContent='？';status.textContent=mode==='room'?'つぎの勝負！手をえらんでね':mode==='npc'?'忍者と じゃんけんしよう♪':'プレイヤー 1 の ばんです♪';result.textContent='';hint.textContent='じぶんの てを えらんでね';next.hidden=true;if(send&&connection?.open)connection.send({type:'next'});}
  function resolve(){
    document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
    const [a,b]=picks;
    let winner='あいこ！もういっかい♪';
    if(a!==b){const p1wins=(a==='rock'&&b==='scissors')||(a==='scissors'&&b==='paper')||(a==='paper'&&b==='rock');const i=p1wins?0:1;scores[i]++;document.querySelector(`#score${i+1}`).textContent=scores[i];winner=i===0?'あなたの かち！🎉':mode==='npc'?'忍者の かち！🥷':'プレイヤー 2 の かち！🎉';}
    status.textContent='じゃん・けん・ぽん！';result.textContent=winner;
    hint.textContent=`あなた ${names[a]}　・　${mode==='npc'?'忍者':mode==='room'?'おともだち':'P2'} ${names[b]}`;next.hidden=false;
  }
  document.querySelectorAll('.choice').forEach(button=>button.addEventListener('click',()=>{
    const playerNumber=Number(button.closest('.player').id.slice(-1));
    if(mode==='room'&&connection?.open){if(roomRole==='guest'&&playerNumber===2){picks[1]=button.dataset.hand;document.querySelector('#hand2').textContent=icons[picks[1]];players[1].querySelectorAll('.choice').forEach(b=>b.disabled=true);status.textContent='相手の手をまっているよ…';connection.send({type:'pick',hand:picks[1]});}else if(roomRole==='host'&&playerNumber===1&&turn===1){picks[0]=button.dataset.hand;document.querySelector('#hand1').textContent=icons[picks[0]];turn=2;players[0].querySelectorAll('.choice').forEach(b=>b.disabled=true);status.textContent='おともだちが手をえらんでいるよ…';}return;}
    if(playerNumber===turn)choose(button.dataset.hand);
  }));
  next.addEventListener('click',()=>resetRound(true));
  document.querySelector('#reset').addEventListener('click',()=>{scores=[0,0];document.querySelector('#score1').textContent='0';document.querySelector('#score2').textContent='0';next.click();});
  document.querySelectorAll('.modebtn[data-mode]').forEach(button=>button.addEventListener('click',()=>{
    mode=button.dataset.mode;document.querySelectorAll('.modebtn').forEach(b=>b.classList.toggle('selected',b===button));
    document.querySelector('#roombox').classList.toggle('show',mode==='room');
    const npc=mode==='npc';document.querySelector('#player2 h2').textContent=npc?'🥷 忍者':'🥷 プレイヤー 2';document.querySelector('#score2label').textContent=npc?'🥷 忍者':'🥷 プレイヤー 2';
    document.querySelector('#player2 .choices').hidden=npc;next.click();
    status.textContent=npc?'忍者と じゃんけんしよう♪':'プレイヤー 1 の ばんです♪';
  }));
  document.querySelector('#makeRoom').addEventListener('click',()=>{
    if(!window.Peer){document.querySelector('#roommessage').textContent='通信ライブラリを読み込めません。インターネット接続を確認してね。';return;}
    document.querySelector('#roommessage').textContent='部屋を準備しています…';if(peer)peer.destroy();peer=new Peer();roomRole='host';
    peer.on('open',id=>{currentRoom=id;document.querySelector('#roomcode').textContent=id;document.querySelector('#joinCode').value=id;document.querySelector('#roommessage').textContent='部屋ができました！招待リンクを送って、おともだちを待とう♪';});
    peer.on('connection',conn=>{if(connection){conn.close();return;}wireRoomConnection(conn);});
    peer.on('error',err=>{document.querySelector('#roommessage').textContent='部屋を作れませんでした。少し待ってもう一度ためしてね。 ('+err.type+')';});
  });
  document.querySelector('#shareRoom').addEventListener('click',async()=>{if(!currentRoom){document.querySelector('#roommessage').textContent='先に「部屋を作る」を押してね。';return;}const invite=`じゃんけん対戦にきてね！部屋コード：${currentRoom}\n${location.href.split('#')[0]}#peer=${encodeURIComponent(currentRoom)}`;try{await navigator.clipboard.writeText(invite);document.querySelector('#roommessage').textContent='招待リンクをコピーしました。おともだちに送ってね♪';}catch{document.querySelector('#roommessage').textContent=invite;}});
  document.querySelector('#joinRoom').addEventListener('click',()=>{const code=document.querySelector('#joinCode').value.trim();if(!code){document.querySelector('#roommessage').textContent='部屋コードを入力してね。';return;}if(!window.Peer){document.querySelector('#roommessage').textContent='通信ライブラリを読み込めません。インターネット接続を確認してね。';return;}document.querySelector('#roommessage').textContent='部屋につないでいます…';if(peer)peer.destroy();peer=new Peer();roomRole='guest';peer.on('open',()=>{wireRoomConnection(peer.connect(code));});peer.on('error',err=>{document.querySelector('#roommessage').textContent='部屋が見つかりません。コードを確認してね。 ('+err.type+')';});});
  const roomMatch=location.hash.match(/peer=([^&]+)/i);if(roomMatch){document.querySelector('#roombox').classList.add('show');document.querySelector('#joinCode').value=decodeURIComponent(roomMatch[1]);document.querySelector('[data-mode="room"]').classList.add('selected');document.querySelector('[data-mode="npc"]').classList.remove('selected');mode='room';document.querySelector('#player2 .choices').hidden=false;}
  // Web Audioで小さなオルゴール風のループを作る（外部音源なし）
  const musicButton=document.querySelector('#music');
  let audio=null, musicTimer=null, noteIndex=0;
  const japanMelody=[587.33,698.46,783.99,1046.5,783.99,698.46,587.33,523.25,587.33,783.99,880,1046.5,880,783.99,698.46,587.33];
  function playNote(){
    if(!audio)return;
    const melody=japanMelody;
    const now=audio.currentTime, frequency=melody[noteIndex%melody.length];
    const osc=audio.createOscillator(), gain=audio.createGain();
    osc.type=theme==='japan'?'triangle':'sine';osc.frequency.value=frequency;
    gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(theme==='japan'?0.052:0.075,now+0.025);gain.gain.exponentialRampToValueAtTime(0.0001,now+(theme==='japan'?0.34:0.62));
    osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+0.64);
    // きらきらする控えめな高音を重ねる
    if(noteIndex%4===0){const bell=audio.createOscillator(), bellGain=audio.createGain();bell.type=theme==='japan'?'sine':'triangle';bell.frequency.value=frequency*(theme==='japan'?1.5:2);bellGain.gain.setValueAtTime(0.0001,now);bellGain.gain.exponentialRampToValueAtTime(theme==='japan'?0.011:0.018,now+0.025);bellGain.gain.exponentialRampToValueAtTime(0.0001,now+0.42);bell.connect(bellGain);bellGain.connect(audio.destination);bell.start(now);bell.stop(now+0.44);}
    noteIndex++;
  }
  musicButton.addEventListener('click',async()=>{
    if(musicTimer){clearInterval(musicTimer);musicTimer=null;musicButton.textContent='♫ BGMをながす';musicButton.setAttribute('aria-pressed','false');return;}
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    if(!AudioContext){musicButton.textContent='このブラウザでは再生できません';return;}
    audio=audio||new AudioContext();if(audio.state==='suspended')await audio.resume();
    playNote();musicTimer=setInterval(playNote,390);musicButton.textContent='♫ BGMをとめる';musicButton.setAttribute('aria-pressed','true');
  });
})();
</script>
</body>
</html>
